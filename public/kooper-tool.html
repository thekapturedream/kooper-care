function readParams() {
  const p = new URLSearchParams(window.location.search);
  return { app: (p.get('app') || 'training').toLowerCase(), as: p.get('as') || 'cm' };
}
function sessionLink(href, id) {
  if (!href) return href;
  if (/[?&]as=/.test(href)) return href;
  if (href.indexOf('#') >= 0 && href.indexOf('?') < 0) {
    return href.split('#')[0] + '?as=' + id + '#' + href.split('#')[1];
  }
  var sep = href.indexOf('?') >= 0 ? '&' : '?';
  return href + sep + 'as=' + id;
}

function render() {
  const { app, as } = readParams();
  const tool = TOOLS[app] || TOOLS.training;
  const s = STAFF_FULL[as] || STAFF_FULL.cm;

  // Title bar text
  document.title = (tool.label.charAt(0).toUpperCase() + tool.label.slice(1)) + ' · ' + s.first + ' · kooper';
  document.getElementById('navAppLabel').textContent = tool.label;
  document.getElementById('footAppLabel').textContent = tool.label;

  // Hero
  document.getElementById('appKicker').textContent = tool.kicker;
  document.getElementById('appTitle').textContent = typeof tool.title === 'function' ? tool.title(s) : tool.title;
  document.getElementById('appSubtitle').textContent = tool.subtitle;

  // Hero actions
  const acts = tool.actions ? tool.actions(s, as) : [];
  document.getElementById('appActions').innerHTML =
    '<a href="' + s.dash + '" class="btn-secondary-on-dark text-xs" style="background:transparent;color:#FFFFFF;border:1px solid rgba(255,255,255,0.4);padding:0.5rem 0.875rem;border-radius:10px;font-weight:500;font-size:0.8125rem;text-decoration:none;display:inline-flex;align-items:center;gap:0.5rem">← ' + s.first + '\'s launcher</a>' +
    acts.map(function (a) {
      const cls = a.primary ? 'btn-yellow' : 'btn-secondary-on-dark';
      const style = a.primary ? '' : 'background:transparent;color:#FFFFFF;border:1px solid rgba(255,255,255,0.4);padding:0.5rem 0.875rem;border-radius:10px;font-weight:500;font-size:0.8125rem;text-decoration:none;display:inline-flex;align-items:center;gap:0.5rem';
      const handler = a.href ? 'href="' + a.href + '"' : 'href="#" onclick="event.preventDefault(); ' + a.onclick + '"';
      return '<a ' + handler + ' class="' + cls + '"' + (style ? ' style="' + style + '"' : '') + '>' + a.label + '</a>';
    }).join('');

  // Stats
  const stats = tool.stats ? tool.stats(s) : [];
  document.getElementById('appStats').innerHTML = stats.map(function (st) {
    const cardClass = st.dark ? 'ov-card dark' : 'ov-card';
    const numStyle = st.ok ? 'color:#10B981' : '';
    return '<div class="' + cardClass + '"><div class="ov-label">' + st.label + '</div><div class="ov-num" style="' + numStyle + '">' + st.num + '</div><div class="ov-sub">' + (st.sub || '') + '</div></div>';
  }).join('');

  // Body
  document.getElementById('appBody').innerHTML = tool.body ? tool.body(s, as) : '';
}
document.addEventListener('DOMContentLoaded', render);
