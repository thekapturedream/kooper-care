<script>
function kooperToast(msg){var t=document.getElementById('toast');t.textContent=msg||'Saved';t.classList.add('on');clearTimeout(window.__t);window.__t=setTimeout(function(){t.classList.remove('on');},1700);}

// ============================================================
// PER-STAFF TOOL STATE — persisted to localStorage so changes
// stick across reloads. Each tool reads/writes its own slice.
// ============================================================
const TOOL_STATE = {}; // { trainingState, payslipState, ... } per (staff,tool)
function _stateKey(tool, staff) { return 'kooper:tool:' + tool + ':' + staff; }
function loadToolState(tool, staff) {
  const k = tool + ':' + staff;
  if (TOOL_STATE[k]) return TOOL_STATE[k];
  try {
    const raw = localStorage.getItem(_stateKey(tool, staff));
    TOOL_STATE[k] = raw ? JSON.parse(raw) : {};
  } catch (e) { TOOL_STATE[k] = {}; }
  return TOOL_STATE[k];
}
function saveToolState(tool, staff) {
  const k = tool + ':' + staff;
  try { localStorage.setItem(_stateKey(tool, staff), JSON.stringify(TOOL_STATE[k] || {})); } catch (e) {}
}
function mutateTool(tool, staff, fn) {
  const st = loadToolState(tool, staff);
  fn(st);
  saveToolState(tool, staff);
  render(); // full re-render of current tool
}

// ============================================================
// DETAIL MODAL · generic drill-in for any tool row
// ============================================================
function openDetail(opts) {
  document.getElementById('kt-detail-kicker').textContent = opts.kicker || '';
  document.getElementById('kt-detail-title').textContent  = opts.title  || '';
  document.getElementById('kt-detail-body').innerHTML     = opts.body   || '';
  document.getElementById('kt-detail-foot').innerHTML     = (opts.actions || []).map(function (a) {
    return '<button class="' + (a.primary ? 'btn-yellow' : 'chip') + '" onclick="' + (a.onclick || 'closeDetail()') + '">' + a.label + '</button>';
  }).join('');
  document.getElementById('kt-scrim').style.display = 'block';
  const m = document.getElementById('kt-detail');
  m.style.display = 'flex';
}
function closeDetail() {
  document.getElementById('kt-scrim').style.display = 'none';
  document.getElementById('kt-detail').style.display = 'none';
}
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDetail(); });

};

function readParams() {
  const p = new URLSearchParams(window.location.search);
  return { app: (p.get('app') || 'training').toLowerCase(), as: p.get('as') || 'cm' };
}
function sessionLink(href, id) {
  if (!href) return href;
  if (/[?&]as=/.test(href)) return href;
  if (href.indexOf('#') >= 0 && href.indexOf('?') < 0) {
    return href.split('#')[0] + '?as=' + id + '#' + href.split('#')[1];
  }
  var sep = href.indexOf('?') >= 0 ? '&' : '?';
  return href + sep + 'as=' + id;
}

// ============================================================
// 7 TOOL DEFINITIONS · each renders the user's relevant content
// ============================================================
const TOOLS = {

  // ---------------- TRAINING ----------------
  training: {
    label: 'training',
    kicker: 'TRAINING · YOUR CURRENCY',
    title: function (s) { return 'Your training is ' + (s.training === 'N/A' ? 'not required (contractor)' : s.training === '15/15' ? 'fully current.' : 'mostly current.'); },
    subtitle: 'Mandatory + CPD courses · self-paced or scheduled · CQC currency rolled into the audit pack automatically.',
    actions: function (s, id) {
      return [
        { label:'Book a session', primary:true, onclick:"openTrainingPicker('" + id + "')" },
        { label:'Open my CPD log', secondary:true, href: sessionLink('kooper-hr.html', id) }
      ];
    },
    stats: function (s) {
      var done = s.training === 'N/A' ? 'N/A' : s.training.split('/')[0];
      var total = s.training === 'N/A' ? '—' : s.training.split('/')[1] || '15';
      return [
        { label:'Mandatory current', num: done + (s.training === 'N/A' ? '' : '/' + total), sub: s.trainingSub || 'all current · 0 expiring', dark: false, ok: s.training === '15/15' },
        { label:'CPD points · year', num:'27', sub:'target 30 by Mar 2027' },
        { label:'Last training', num:'14d ago', sub:'Manual handling refresher' },
        { label:'Next due', num:'Jan 2027', sub:'Annual safeguarding update', dark:true }
      ];
    },
    body: function (s, id) {
      const items = [
        { key:'manual',     name:'Manual handling',         status:'ok',   meta:'Last 14 Mar 2026 · valid 12 months · expires 14 Mar 2027' },
        { key:'safeguard',  name:'Safeguarding adults',     status:'ok',   meta:'Last 22 Feb 2026 · valid 12 months · expires 22 Feb 2027' },
        { key:'fire',       name:'Fire safety',             status:'ok',   meta:'Last 18 Apr 2026 · valid 12 months · expires 18 Apr 2027' },
        { key:'infection',  name:'Infection prevention',    status:'ok',   meta:'Last 9 Jan 2026 · valid 12 months · expires 9 Jan 2027' },
        { key:'mca',        name:'Mental capacity & DoLS',  status:'ok',   meta:'Last 3 Mar 2026 · valid 12 months' },
        { key:'meds',       name:'Medication awareness',    status: s.role && s.role.indexOf('Carer') >= 0 ? 'ok' : 'na', meta: s.role && s.role.indexOf('Nurse') >= 0 ? 'Nurse-grade · NMC revalidation 2027' : 'Awareness-level for non-clinical' },
        { key:'food',       name:'Food hygiene · L2',       status: s.role && s.role.indexOf('Cook') >= 0 ? 'ok' : 'na',  meta: s.role && s.role.indexOf('Cook') >= 0 ? 'Last 12 Feb 2026 · L2 ' : 'Not required for your role' },
        { key:'firstaid',   name:'First aid · emergency',   status:'ok',   meta:'Last 7 Mar 2026 · valid 3 years' }
      ];
      const st = loadToolState('training', id);
      return `
        <div class="surface-card overflow-hidden">
          <div class="px-5 py-4 border-b border-[#ECEAE3] bg-kapture-paper flex items-center justify-between flex-wrap gap-2">
            <div class="ed-kicker">YOUR MANDATORY TRAINING</div>
            <span class="text-xs muted">8 modules · auto-tracked · CQC-currency aligned</span>
          </div>
          ${items.map(it => {
            const booked = st[it.key];

  document.title = (tool.label.charAt(0).toUpperCase() + tool.label.slice(1)) + ' · ' + s.first + ' · kooper';

  document.getElementById('appKicker').textContent = tool.kicker;
  document.getElementById('appTitle').textContent = typeof tool.title === 'function' ? tool.title(s) : tool.title;
  document.getElementById('appSubtitle').textContent = tool.subtitle;

  // Hero actions
  const acts = tool.actions ? tool.actions(s, as) : [];
  document.getElementById('appActions').innerHTML =
    '<a href="' + s.dash + '" class="btn-secondary-on-dark text-xs" style="background:transparent;color:#FFFFFF;border:1px solid rgba(255,255,255,0.4);padding:0.5rem 0.875rem;border-radius:10px;font-weight:500;font-size:0.8125rem;text-decoration:none;display:inline-flex;align-items:center;gap:0.5rem">← ' + s.first + '\'s launcher</a>' +
    acts.map(function (a) {
      const cls = a.primary ? 'btn-yellow' : 'btn-secondary-on-dark';
      const style = a.primary ? '' : 'background:transparent;color:#FFFFFF;border:1px solid rgba(255,255,255,0.4);padding:0.5rem 0.875rem;border-radius:10px;font-weight:500;font-size:0.8125rem;text-decoration:none;display:inline-flex;align-items:center;gap:0.5rem';
      const handler = a.href ? 'href="' + a.href + '"' : 'href="#" onclick="event.preventDefault(); ' + a.onclick + '"';
      return '<a ' + handler + ' class="' + cls + '"' + (style ? ' style="' + style + '"' : '') + '>' + a.label + '</a>';
    }).join('');

  // Stats
  const stats = tool.stats ? tool.stats(s, as) : [];
  document.getElementById('appStats').innerHTML = stats.map(function (st) {
    const cardClass = st.dark ? 'ov-card dark' : 'ov-card';
    const numStyle = st.ok ? 'color:#10B981' : '';
    return '<div class="' + cardClass + '"><div class="ov-label">' + st.label + '</div><div class="ov-num" style="' + numStyle + '">' + st.num + '</div><div class="ov-sub">' + (st.sub || '') + '</div></div>';
  }).join('');

  // Body
  document.getElementById('appBody').innerHTML = tool.body ? tool.body(s, as) : '';
}
document.addEventListener('DOMContentLoaded', render);
</script>
